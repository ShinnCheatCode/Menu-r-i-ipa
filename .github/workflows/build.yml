name: Build Standalone ShinnThieuu App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Standalone Binary
      run: |
        echo "[+] Bắt đầu biên dịch ứng dụng độc lập..."
        
        # Biên dịch trực tiếp tệp main.m và AppDelegate.mm thành tệp thực thi nhị phân iOS arm64
        clang++ -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -framework Foundation -framework UIKit -framework CoreGraphics \
        main.m -o ShinnThieuuApp
        
        echo "[+] Biên dịch nhị phân thành công!"

    - name: Package IPA Structure
      run: |
        # Tạo cấu trúc thư mục ứng dụng chuẩn .app
        mkdir -p ShinnThieuu_Output/Payload/ShinnThieuuApp.app
        
        # Di chuyển tệp thực thi và file cấu hình Info.plist vào trong gói app
        mv ShinnThieuuApp ShinnThieuu_Output/Payload/ShinnThieuuApp.app/
        cp Info.plist ShinnThieuu_Output/Payload/ShinnThieuuApp.app/
        
        echo "[+] Đã đóng gói xong cấu trúc ứng dụng!"

    - name: Create IPA Archive
      run: |
        cd ShinnThieuu_Output
        zip -r -y ../ShinnThieuu_Standalone.ipa Payload/
        cd ..
        
        mkdir IPA_Release
        mv ShinnThieuu_Standalone.ipa IPA_Release/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShinnThieuu_Standalone_IPA
        path: IPA_Release/ShinnThieuu_Standalone.ipa
