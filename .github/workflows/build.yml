name: Build ShinnThieuu IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild \
            -project ShinnThieuuApp.xcodeproj \
            -scheme ShinnThieuuApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload
        run: |
          mkdir -p Payload
          APP=$(find build -type d -name "*.app" | head -n 1)
          cp -R "$APP" Payload/
          zip -r ShinnThieuuApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnThieuuApp-IPA
          path: ShinnThieuuApp.ipa