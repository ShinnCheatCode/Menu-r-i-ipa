name: Build Shinn IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source directory
        shell: bash
        run: |
          set -euo pipefail

          echo "===== REPOSITORY ====="
          pwd
          find . -maxdepth 4 -type f | sort

          MAIN_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "main.m" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$MAIN_FILE" ]; then
            echo "::error::Không tìm thấy main.m"
            exit 1
          fi

          SOURCE_DIR="$(dirname "$MAIN_FILE")"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Source directory:"
          echo "$SOURCE_DIR"
          echo "================================"

      - name: Check source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking:"
          echo "$SOURCE_DIR"

          test -f "$SOURCE_DIR/main.m"
          test -f "$SOURCE_DIR/AppDelegate.mm"
          test -f "$SOURCE_DIR/Info.plist"

          echo "main.m         OK"
          echo "AppDelegate.mm OK"
          echo "Info.plist     OK"

          if [ -f "$SOURCE_DIR/builder.mm" ]; then
            echo "builder.mm     OK"
          fi

      - name: Check Xcode
        run: |
          set -euo pipefail

          xcodebuild -version

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "iPhoneOS SDK:"
          echo "$SDK_PATH"

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang++)"

          APP_NAME="ShinnThieuuApp"

          BUILD_DIR="$GITHUB_WORKSPACE/build"
          APP_DIR="$BUILD_DIR/$APP_NAME.app"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APP_DIR"

          echo "================================"
          echo "Building $APP_NAME"
          echo "================================"

          SOURCES=()

          if [ -f "main.m" ]; then
            SOURCES+=("main.m")
          fi

          if [ -f "AppDelegate.mm" ]; then
            SOURCES+=("AppDelegate.mm")
          fi

          if [ -f "builder.mm" ]; then
            SOURCES+=("builder.mm")
          fi

          echo "Source files:"
          printf '%s\n' "${SOURCES[@]}"

          "$CLANG" \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            "${SOURCES[@]}" \
            -framework UIKit \
            -framework Foundation \
            -o "$APP_DIR/$APP_NAME"

          cp "Info.plist" "$APP_DIR/Info.plist"

          echo "================================"
          echo "APP CREATED"
          echo "================================"

          find "$APP_DIR" -maxdepth 2 -type f -print

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail

          APP="$GITHUB_WORKSPACE/build/ShinnThieuuApp.app"

          test -d "$APP"
          test -f "$APP/ShinnThieuuApp"
          test -f "$APP/Info.plist"

          echo "Executable:"
          file "$APP/ShinnThieuuApp"

          echo "Info.plist:"
          plutil -lint "$APP/Info.plist"

      - name: Create Payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/Payload"

          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R \
            "$GITHUB_WORKSPACE/build/ShinnThieuuApp.app" \
            "$GITHUB_WORKSPACE/Payload/"

          echo "Payload:"
          find "$GITHUB_WORKSPACE/Payload" -maxdepth 3 -type f -print

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -f ShinnThieuuApp_Unsigned.ipa

          /usr/bin/zip \
            -qry \
            ShinnThieuuApp_Unsigned.ipa \
            Payload

          echo "================================"
          echo "IPA CREATED"
          echo "================================"

          ls -lh ShinnThieuuApp_Unsigned.ipa

          unzip -t ShinnThieuuApp_Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnThieuu-IPA
          path: ShinnThieuuApp_Unsigned.ipa
          if-no-files-found: error