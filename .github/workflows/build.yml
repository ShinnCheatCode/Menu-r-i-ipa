name: Build ShinnThieuu Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Package Structure
      run: |
        echo "[+] Đang thiết lập cấu trúc gói ứng dụng ShinnThieuu..."
        
        # Tạo cấu trúc thư mục ứng dụng gốc chuẩn iOS
        mkdir -p ShinnThieuu_Output/Payload/FreeFire.app/Data/Managed/
        
        # Sao chép các tệp core và cấu hình vào đúng vị trí
        cp Assembly-CSharp-patch.bytes ShinnThieuu_Output/Payload/FreeFire.app/Data/Managed/
        cp localConfig.json ShinnThieuu_Output/Payload/FreeFire.app/
        
        # Nếu có tệp builder.mm hoặc thư viện biên dịch sẵn, đưa vào đây
        if [ -f builder.mm ]; then
          cp builder.mm ShinnThieuu_Output/Payload/FreeFire.app/
        fi
        
        echo "[+] Đã nạp thành công toàn bộ tài nguyên Core v2.0"

    - name: Archive to IPA
      run: |
        cd ShinnThieuu_Output
        zip -r -y ../FreeFire_ShinnThieuu.ipa Payload/
        cd ..
        
        mkdir IPA_Release
        mv FreeFire_ShinnThieuu.ipa IPA_Release/

    - name: Upload Artifact IPA
      uses: actions/upload-artifact@v4
      with:
        name: ShinnThieuu_Release_IPA
        path: IPA_Release/FreeFire_ShinnThieuu.ipa
