name: Build Shinn IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build IPA from ZIP
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES IN REPOSITORY ====="
          find . -maxdepth 4 -type f -print

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -iname '*.zip' \) \
            -not -path '*/.git/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy file ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$GITHUB_WORKSPACE/extracted"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "===== EXTRACT ZIP ====="

          /usr/bin/unzip -q "$ZIP_FILE" -d "$EXTRACT"

          echo "===== EXTRACTED FILES ====="
          find "$EXTRACT" -type f -print

      - name: Clean hidden Unicode characters
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os

          root = os.environ["GITHUB_WORKSPACE"] + "/extracted"

          bad_chars = [
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\ufeff",
          ]

          for current_root, dirs, files in os.walk(root, topdown=False):
              for name in files + dirs:
                  new_name = name

                  for char in bad_chars:
                      new_name = new_name.replace(char, "")

                  if new_name != name:
                      old_path = os.path.join(current_root, name)
                      new_path = os.path.join(current_root, new_name)

                      if not os.path.exists(new_path):
                          os.rename(old_path, new_path)
                          print(f"Renamed: {repr(name)} -> {repr(new_name)}")
          PY

      - name: Locate source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/extracted"

          echo "===== SEARCH SOURCE ====="

          MAIN_FILE="$(find "$ROOT" \
            -type f \
            -name 'main.m' \
            -not -path '*/.git/*' \
            | head -n 1)"

          if [ -z "$MAIN_FILE" ]; then
            echo "::error::Không tìm thấy main.m sau khi giải nén ZIP"
            find "$ROOT" -type f -print
            exit 1
          fi

          SOURCE_DIR="$(dirname "$MAIN_FILE")"

          echo "main.m       = $MAIN_FILE"
          echo "SOURCE_DIR   = $SOURCE_DIR"

          if [ ! -f "$SOURCE_DIR/AppDelegate.mm" ]; then
            echo "::error::Không tìm thấy AppDelegate.mm"
            exit 1
          fi

          if [ ! -f "$SOURCE_DIR/Info.plist" ]; then
            echo "::error::Không tìm thấy Info.plist"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Check Xcode
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          echo "===== iOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"

          APP_NAME="ShinnThieuuApp"
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          APP="$BUILD_DIR/$APP_NAME.app"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APP"

          echo "===== SOURCE ====="
          find "$SOURCE_DIR" -maxdepth 2 -type f -print

          echo "===== COMPILE main.m ====="

          "$CC" \
            -isysroot "$SDK" \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            -I"$SOURCE_DIR" \
            -c "$SOURCE_DIR/main.m" \
            -o "$BUILD_DIR/main.o"

          echo "===== COMPILE AppDelegate.mm ====="

          "$CXX" \
            -isysroot "$SDK" \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            -I"$SOURCE_DIR" \
            -c "$SOURCE_DIR/AppDelegate.mm" \
            -o "$BUILD_DIR/AppDelegate.o"

          OBJECTS=(
            "$BUILD_DIR/main.o"
            "$BUILD_DIR/AppDelegate.o"
          )

          if [ -f "$SOURCE_DIR/builder.mm" ]; then

            echo "===== COMPILE builder.mm ====="

            "$CXX" \
              -isysroot "$SDK" \
              -arch arm64 \
              -miphoneos-version-min=17.0 \
              -fobjc-arc \
              -I"$SOURCE_DIR" \
              -c "$SOURCE_DIR/builder.mm" \
              -o "$BUILD_DIR/builder.o"

            OBJECTS+=("$BUILD_DIR/builder.o")
          fi

          echo "===== LINK ====="

          "$CXX" \
            -isysroot "$SDK" \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            "${OBJECTS[@]}" \
            -framework UIKit \
            -framework Foundation \
            -o "$APP/$APP_NAME"

          echo "===== COPY INFO.PLIST ====="

          cp "$SOURCE_DIR/Info.plist" "$APP/Info.plist"

          echo "===== APP CONTENT ====="
          find "$APP" -maxdepth 2 -type f -print

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail

          APP="$GITHUB_WORKSPACE/build/ShinnThieuuApp.app"

          test -d "$APP"
          test -f "$APP/ShinnThieuuApp"
          test -f "$APP/Info.plist"

          plutil -lint "$APP/Info.plist"

          echo "===== APP INFO ====="
          file "$APP/ShinnThieuuApp"

          echo "APP BUILD OK"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/ShinnThieuuApp.app" \
            "Payload/ShinnThieuuApp.app"

          rm -f "ShinnThieuuApp_Unsigned.ipa"

          /usr/bin/zip -qry \
            "ShinnThieuuApp_Unsigned.ipa" \
            Payload

          echo "===== IPA CREATED ====="

          ls -lh "ShinnThieuuApp_Unsigned.ipa"

          unzip -t "ShinnThieuuApp_Unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnThieuu-IPA
          path: ShinnThieuuApp_Unsigned.ipa
          if-no-files-found: error