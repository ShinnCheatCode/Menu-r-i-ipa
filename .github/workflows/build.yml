name: Build Shinn IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show source
        shell: bash
        run: |
          set -e

          echo "===== SOURCE ====="
          find . -maxdepth 3 -type f | sort

      - name: Check Xcode
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          # Xóa các ký tự Unicode ẩn từng gây lỗi tên file
          find . -depth -name '*#U2060*' -print

          while IFS= read -r file; do
            new="${file//\#U2060/}"
            if [ "$file" != "$new" ]; then
              mv "$file" "$new"
            fi
          done < <(find . -depth -name '*#U2060*' -print)

          echo "===== AFTER CLEAN ====="
          find . -maxdepth 3 -type f | sort

      - name: Find source files
        shell: bash
        run: |
          set -e

          test -f "main.m"
          test -f "AppDelegate.mm"
          test -f "Info.plist"

          echo "main.m              OK"
          echo "AppDelegate.mm      OK"
          echo "Info.plist          OK"

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang++)"

          APP_NAME="ShinnThieuuApp"
          BUILD_DIR="$PWD/build"
          APP_DIR="$BUILD_DIR/$APP_NAME.app"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APP_DIR"

          echo "SDK: $SDK_PATH"
          echo "Compiler: $CLANG"

          "$CLANG" \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            main.m \
            AppDelegate.mm \
            builder.mm \
            -o "$APP_DIR/$APP_NAME"

          cp Info.plist "$APP_DIR/Info.plist"

          echo "===== APP CONTENT ====="
          find "$APP_DIR" -maxdepth 2 -type f -print

      - name: Verify application
        shell: bash
        run: |
          set -e

          APP="build/ShinnThieuuApp.app"

          test -f "$APP/ShinnThieuuApp"
          test -f "$APP/Info.plist"

          file "$APP/ShinnThieuuApp"

          echo "Application created successfully."

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R "build/ShinnThieuuApp.app" "Payload/"

          rm -f ShinnThieuuApp_Unsigned.ipa

          /usr/bin/zip \
            -qry \
            "ShinnThieuuApp_Unsigned.ipa" \
            Payload

          echo "===== IPA ====="
          ls -lh ShinnThieuuApp_Unsigned.ipa

          echo "===== IPA CONTENT ====="
          unzip -l ShinnThieuuApp_Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnThieuu-IPA
          path: ShinnThieuuApp_Unsigned.ipa
          if-no-files-found: error